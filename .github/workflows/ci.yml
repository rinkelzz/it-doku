name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # beide Enden: 3.8 = ältestes DSM-Python, 3.13 = neuestes
          - { python: "3.8", os: ubuntu-22.04 }
          - { python: "3.13", os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  agent:
    name: Agent ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows (PowerShell 5.1), os: windows-latest }
          - { name: macOS, os: macos-latest }
          - { name: Linux, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Windows – Bericht senden (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: python tests/agent_e2e.py --with-vault powershell.exe -NoProfile -ExecutionPolicy Bypass -File app/agent/itdoku-agent.ps1 -Run -Url "{url}" -Token "{token}" -AllowHttp -SkipUpdateSearch
      - name: Windows – Einrichten als geplante Aufgabe
        if: runner.os == 'Windows'
        run: python tests/agent_e2e.py powershell.exe -NoProfile -ExecutionPolicy Bypass -File app/agent/itdoku-agent.ps1 -Install -Url "{url}" -Token "{token}" -AllowHttp -SkipUpdateSearch
      - name: Linux/macOS – Bericht senden
        if: runner.os != 'Windows'
        run: python tests/agent_e2e.py --expect-scan python3 app/agent/itdoku-agent.py --run --url "{url}" --token "{token}" --allow-http
      - name: Linux/macOS – Einrichten (Zeitplan)
        if: runner.os != 'Windows'
        run: sudo -E env "PATH=$PATH" python tests/agent_e2e.py python3 app/agent/itdoku-agent.py --install --url "{url}" --token "{token}" --allow-http

  spk:
    name: SPK bauen
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: ./synology/build_spk.sh
      - uses: actions/upload-artifact@v6
        with:
          name: itdoku-spk
          path: dist/*.spk
          retention-days: 14
